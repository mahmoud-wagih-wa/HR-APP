<style>
  :root{
    --paper:#EEF1EF;
    --card:#FFFFFF;
    --ink:#16262B;
    --ink-soft:#4B5D5A;
    --brand:#2B5F5A;
    --brand-dark:#1B3A34;
    --accent:#C97B3D;
    --accent-soft:#F3E3D2;
    --success:#3E7C59;
    --success-soft:#E1EFE6;
    --danger:#B34B4B;
    --danger-soft:#F6E4E4;
    --brand-soft:#E3ECE9;
    --line:#DADFDC;
    --type1:#2B5F5A;
    --type2:#C97B3D;
    --type3:#7A5AA8;
    --transfer:#5C6B73;
  }
  html.dark-mode{
    --paper:#12211D;
    --card:#1A2E29;
    --ink:#E7EEEB;
    --ink-soft:#94A69F;
    --brand:#4C8C82;
    --brand-dark:#0D1E1A;
    --accent:#DB9760;
    --accent-soft:#3B2E1E;
    --success:#5FAB80;
    --success-soft:#1E3628;
    --danger:#DF7B7B;
    --danger-soft:#3B2222;
    --brand-soft:#20362F;
    --line:#2E4741;
    --type1:#4C8C82;
    --type2:#DB9760;
    --type3:#A78BD1;
    --transfer:#8FA19A;
  }
  html.dark-mode body{background:var(--paper);}
  html.dark-mode .logo-img{background:#fff;}
  html.dark-mode ::-webkit-scrollbar{background:var(--paper);}
  html.dark-mode ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.brand-font{font-family:'Cairo',sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;margin-right:calc(190px + 16px);padding:20px 16px 60px;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;margin-bottom:18px;flex-wrap:wrap;
  }
  .brand-row{display:flex;align-items:center;gap:14px;}
  .logo-img{width:52px;height:52px;object-fit:contain;border-radius:10px;background:#fff;padding:4px;box-shadow:0 1px 3px rgba(20,40,35,.12);}
  .title-block h1{margin:0;font-size:26px;color:var(--brand-dark);}
  .title-block p{margin:4px 0 0;color:var(--ink-soft);font-size:14px;}
  .stamp{
    background:var(--brand-dark);color:#fff;border-radius:10px;
    padding:10px 16px;font-family:'Cairo',sans-serif;font-weight:700;
    font-size:13px;display:flex;align-items:center;gap:8px;letter-spacing:.5px;
  }
  .stamp .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}

  .export-btn{
    background:var(--brand);color:#fff;border:none;border-radius:8px;
    padding:10px 18px;font-family:'Tajawal',sans-serif;font-weight:700;
    font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;
    transition:.15s;
  }
  .export-btn:hover{background:var(--brand-dark);}
  .export-btn.secondary-export{background:#E2E7E4;color:var(--ink);}
  .export-btn.secondary-export:hover{background:#D5DBD7;}

  /* Sidebar navigation (desktop) — flush to the far right edge, dark creative theme */
  nav.tabs{
    display:flex;flex-direction:column;gap:5px;margin-bottom:0;
    width:196px;flex-shrink:0;
    position:fixed;top:0;right:0;height:100vh;overflow-y:auto;
    background:linear-gradient(180deg,var(--brand-dark) 0%,#122824 100%);
    border-left:none;box-shadow:2px 0 10px rgba(0,0,0,.15);
    padding:20px 12px;z-index:20;
  }
  nav.tabs::before{
    content:'';display:block;height:3px;border-radius:3px;margin:0 4px 16px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--type3) 100%);
  }
  nav.tabs button{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;
    background:transparent;color:rgba(255,255,255,.68);border:none;
    padding:12px 14px;border-radius:10px;cursor:pointer;
    text-align:right;transition:.15s;border-right:3px solid transparent;
  }
  nav.tabs button:hover{background:rgba(255,255,255,.08);color:#fff;}
  nav.tabs button[data-tab="rewards"]{font-size:12px;white-space:nowrap;padding-left:8px;padding-right:8px;}
  nav.tabs button[data-tab="settings"]{font-size:12px;white-space:nowrap;padding-left:8px;padding-right:8px;}
  nav.tabs button.active{
    background:linear-gradient(120deg,var(--brand) 0%,#2f6f66 100%);
    color:#fff;border-right-color:var(--accent);
    box-shadow:0 3px 8px rgba(0,0,0,.25);
  }
  .nav-badge{
    display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;
    border-radius:999px;padding:2px 7px;margin-right:2px;vertical-align:middle;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .panel{
    background:var(--card);border-radius:12px;
    padding:22px;box-shadow:0 1px 3px rgba(20,40,35,.08);
    min-height:340px;
  }

  /* summary cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .report-visual{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;margin-bottom:6px;}
  .report-visual .cards{flex:1.4;min-width:280px;margin-bottom:0;}
  .report-chart-box{
    flex:1;min-width:240px;background:var(--paper);border:1px solid var(--line);
    border-radius:10px;padding:14px 16px;
  }
  .report-chart-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .card{background:var(--paper);border-radius:10px;padding:14px 16px;border:1px solid var(--line);}
  .card .num{font-family:'Cairo',sans-serif;font-weight:800;font-size:30px;color:var(--brand-dark);}
  .card .lbl{font-size:13px;color:var(--ink-soft);margin-top:3px;}

  .stats-panel{
    background:linear-gradient(155deg,var(--card) 0%,#F7F9F8 100%);border:1px solid var(--line);
    border-radius:16px;padding:22px 24px;margin-bottom:22px;
  }
  .stats-row{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;}
  .stat-item{display:flex;align-items:center;gap:14px;flex:1;min-width:170px;padding:4px 18px;}
  .stat-item:first-child{padding-right:0;}
  .stat-icon{
    width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:var(--stat-soft,var(--brand-soft));box-shadow:inset 0 0 0 1px var(--line);
  }
  .stat-num{font-family:'Cairo',sans-serif;font-weight:800;font-size:30px;color:var(--brand-dark);line-height:1;}
  .stat-lbl{font-size:12.5px;color:var(--ink-soft);margin-top:5px;}
  .stat-divider{width:1px;align-self:stretch;background:var(--line);margin:2px 4px;flex:none;}
  .status-strip{display:flex;align-items:center;gap:14px;margin-top:20px;padding-top:18px;border-top:1px dashed var(--line);flex-wrap:wrap;}
  .status-strip-lbl{font-size:13.5px;color:var(--ink-soft);font-weight:700;white-space:nowrap;}
  .status-bar{flex:1;min-width:160px;display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--paper);}
  .status-bar span{height:100%;}
  .status-legend{display:flex;gap:22px;flex-wrap:wrap;}
  .status-legend-item{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .status-legend-dot{width:13px;height:13px;border-radius:50%;flex:none;}

  .dash-factory-title{margin:0 0 12px;color:var(--brand-dark);}
  .dash-two-col{display:flex;gap:32px;flex-wrap:wrap;margin-bottom:24px;}
  .dash-two-col>div{flex:1;min-width:280px;}
  .factory-bars{display:flex;flex-direction:column;gap:12px;max-width:640px;}
  .factory-bar-row{display:flex;align-items:center;gap:12px;}
  .factory-bar-lbl{width:84px;flex:none;font-size:13px;color:var(--ink);font-weight:700;}
  .factory-bar-lbl.rank-lbl{width:96px;font-size:12.5px;}
  .factory-bar-lbl.emp-lbl{width:130px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cap-warn-list{display:flex;flex-direction:column;gap:6px;}
  .cap-warn-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:13.5px;}
  .cap-warn-row.over{background:var(--danger-soft);border-color:transparent;color:var(--danger);font-weight:700;}
  .cap-warn-name{font-weight:700;}
  .cap-warn-nums{font-family:'Cairo',sans-serif;font-weight:800;font-size:13.5px;}
  .raha-scorecard{padding:6px 0 2px;}
  .raha-score-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .raha-score-main{display:flex;align-items:baseline;gap:6px;}
  .raha-score-num{font-family:'Cairo',sans-serif;font-weight:800;font-size:36px;color:var(--success);}
  .raha-score-num.over{color:var(--danger);}
  .raha-score-of{font-size:13.5px;color:var(--ink-soft);}
  .raha-score-pct{font-family:'Cairo',sans-serif;font-weight:800;font-size:20px;color:var(--success);}
  .raha-score-pct.over{color:var(--danger);}
  .raha-gauge-track{height:16px;border-radius:8px;background:var(--paper);border:1px solid var(--line);overflow:hidden;}
  .raha-gauge-fill{height:100%;border-radius:8px;background:var(--success);transition:width .3s ease;}
  .raha-gauge-fill.over{background:var(--danger);}
  .raha-score-sub{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .raha-score-status{margin-top:14px;padding:10px 14px;border-radius:8px;font-weight:700;font-size:13.5px;background:var(--success-soft);color:var(--success);}
  .raha-score-status.over{background:var(--danger-soft);color:var(--danger);}
  .alex-week-box{margin-bottom:20px;border-right:4px solid var(--accent);}
  .alex-week-sub{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .alex-split{display:flex;align-items:stretch;gap:18px;margin-top:6px;}
  .alex-split-col{flex:1;min-width:0;border-radius:12px;padding:14px 16px;}
  .alex-col-here{background:linear-gradient(135deg,var(--accent) 0%,#D89257 100%);}
  .alex-col-here .alex-week-sub{color:#fff;font-size:13px;}
  .alex-col-travel{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);}
  .alex-col-travel .alex-week-sub{color:#fff;font-size:13px;}
  .alex-split-divider{width:1px;background:var(--line);flex:none;}
  .alex-split .people-chip{background:rgba(255,255,255,.92);}
  .people-chip-list{display:flex;flex-wrap:wrap;gap:9px;max-height:190px;overflow-y:auto;padding:2px;}
  .people-chip{
    display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:22px;padding:6px 14px 6px 8px;font-size:12.5px;font-weight:700;color:var(--brand-dark);
    box-shadow:0 1px 2px rgba(27,58,52,.05);
  }
  .people-chip .chip-icon{
    width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:12px;background:var(--chip-clr-soft,var(--brand-soft));
  }
  .people-chip .chip-code{font-weight:400;color:var(--ink-soft);font-size:11px;}
  .factory-bar-track{flex:1;height:14px;border-radius:7px;background:var(--paper);border:1px solid var(--line);overflow:hidden;}
  .factory-bar-fill{height:100%;border-radius:7px;transition:width .3s ease;}
  .factory-bar-num{width:30px;flex:none;text-align:left;font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;color:var(--brand-dark);}

  .rank-chip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;align-content:start;}
  .rank-chip{
    background:var(--paper);border:1px solid var(--line);border-right:4px solid var(--line);
    border-radius:10px;padding:12px 14px;
  }
  .rank-chip .n{font-family:'Cairo',sans-serif;font-weight:800;font-size:21px;color:var(--brand-dark);line-height:1.1;}
  .rank-chip .l{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .dash-insights{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
  .dash-insight-box{flex:1;min-width:260px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .dash-insight-wide{flex:1.6;}
  .dash-today-list{display:flex;flex-direction:column;gap:8px;max-height:210px;overflow-y:auto;}
  .dash-today-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0;}
  .dash-today-name{flex:1;font-weight:700;color:var(--brand-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dash-today-code{font-weight:400;color:var(--ink-soft);font-size:11.5px;}
  .dash-today-type{font-size:11.5px;color:var(--brand);background:var(--paper);border-radius:999px;padding:2px 9px;white-space:nowrap;font-weight:700;}
  .dash-today-shift{font-size:11.5px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;}

  .dash-week-header{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;
  }
  .dash-week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:10px;}
  .dash-week-card{
    background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:12px;
    padding:16px;box-shadow:0 1px 3px rgba(20,40,35,.06);
  }
  .dash-week-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .dash-week-factory{font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;}
  .dash-week-total{font-size:12.5px;color:var(--ink-soft);background:var(--paper);border-radius:999px;padding:3px 10px;}

  /* Donut chart — shift distribution */
  .donut-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .donut{width:80px;height:80px;border-radius:50%;position:relative;flex-shrink:0;}
  .donut-hole{
    position:absolute;top:9px;left:9px;right:9px;bottom:9px;background:var(--card);
    border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;
  }
  .donut-hole .tot-n{font-family:'Cairo',sans-serif;font-weight:800;font-size:17px;color:var(--brand-dark);line-height:1;}
  .donut-hole .tot-l{font-size:9px;color:var(--ink-soft);margin-top:2px;}
  .donut-legend{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
  .donut-legend .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-soft);}
  .donut-legend .row .lbl{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .donut-legend .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .donut-legend .row b{font-family:'Cairo',sans-serif;color:var(--brand-dark);}

  /* Big donut variant — dashboard monthly leave-type distribution */
  .donut-row.big{gap:32px;margin-bottom:6px;padding:10px 6px 18px;}
  .donut.big{width:190px;height:190px;box-shadow:0 2px 8px rgba(20,40,35,.08);}
  .donut.big .donut-hole{top:26px;left:26px;right:26px;bottom:26px;}
  .donut.big .donut-hole .tot-n{font-size:38px;}
  .donut.big .donut-hole .tot-l{font-size:13px;}
  .donut-legend.big{gap:16px;}
  .donut-legend.big .row{font-size:16px;padding:6px 0;border-bottom:1px dashed var(--line);}
  .donut-legend.big .row:last-child{border-bottom:none;}
  .donut-legend.big .dot{width:13px;height:13px;}
  .donut-legend.big .row b{font-size:18px;}
  .donut-legend .row-right{display:flex;align-items:center;gap:8px;}
  .donut-legend .row .pct{font-size:12px;color:var(--ink-soft);background:var(--paper);border-radius:999px;padding:2px 8px;}

  /* Mini bar chart — leaves per shift */
  .dash-week-leaves-title{font-size:12px;font-weight:700;color:var(--ink-soft);margin:10px 0 4px;border-top:1px dashed var(--line);padding-top:10px;}
  .mini-bars{display:flex;align-items:flex-end;gap:8px;height:64px;}
  .mini-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;height:100%;}
  .mini-bar-val{font-family:'Cairo',sans-serif;font-weight:800;font-size:11.5px;color:var(--brand-dark);margin-bottom:3px;}
  .mini-bar{width:100%;max-width:28px;border-radius:5px 5px 2px 2px;min-height:4px;background:var(--line);}
  .mini-bar-lbl{font-size:10px;color:var(--ink-soft);margin-top:4px;}
  .mini-bars-empty{font-size:12.5px;color:var(--success);text-align:center;padding:10px 0 2px;}
  .activity-feed{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow-y:auto;}
  .activity-row{padding:10px 4px;border-bottom:1px solid var(--line);}
  .activity-row:last-child{border-bottom:none;}
  .activity-desc{font-size:13.5px;color:var(--ink);font-weight:600;}
  .activity-meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  table{width:100%;border-collapse:collapse;font-size:15px;}
  th{
    text-align:right;font-family:'Cairo',sans-serif;font-weight:700;
    color:var(--ink-soft);font-size:12.5px;padding:9px 10px;
    border-bottom:2px solid var(--line);white-space:nowrap;
  }
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:#FAFBFA;}
  .empty-row td{text-align:center;color:var(--ink-soft);padding:30px;}

  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
    border-radius:999px;font-size:12.5px;font-weight:700;font-family:'Cairo',sans-serif;
  }
  .pill.status-دائم{background:var(--success-soft);color:var(--success);}
  .pill.status-مؤقت{background:var(--accent-soft);color:var(--accent);}
  .pill.status-تحت-الاختبار{background:var(--danger-soft);color:var(--danger);}
  .pill.factory-pill{color:#fff;}

  .type-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .type-راحة{background:var(--type1);}
  .type-يوم-شهر{background:var(--type2);}
  .type-راحة-عيد{background:var(--type3);}
  .type-انتقال-مصنع{background:var(--transfer);}
  .type-تغيير-الحالة{background:var(--type3);}
  .log-transfer-note{color:var(--transfer);font-weight:700;}
  .type-مكافأة{background:var(--success);}
  .type-جزاء{background:var(--danger);}
  .citation-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-weight:700;font-size:12.5px;}
  .citation-pill.مكافأة{background:var(--success-soft);color:var(--success);}
  .citation-pill.جزاء{background:var(--danger-soft);color:var(--danger);}
  .citation-amount{font-family:'Cairo',sans-serif;font-weight:800;font-size:14.5px;}
  .citation-amount.مكافأة{color:var(--success);}
  .citation-amount.جزاء{color:var(--danger);}

  form.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;align-items:end;margin-bottom:18px;}

  .emp-suggest{
    position:absolute;top:100%;right:0;left:0;margin-top:4px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(20,40,35,.15);
    max-height:230px;overflow-y:auto;z-index:30;
  }
  .emp-suggest-item{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--paper);}
  .emp-suggest-item:last-child{border-bottom:none;}
  .emp-suggest-item:hover{background:var(--paper);}
  .emp-suggest-name{font-weight:700;color:var(--brand-dark);font-size:13.5px;}
  .emp-suggest-meta{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .emp-suggest-empty{padding:10px 12px;font-size:12.5px;color:var(--ink-soft);text-align:center;}

  .emp-avatar-wrap{position:relative;width:52px;height:52px;}
  .emp-avatar{
    width:52px;height:52px;border-radius:50%;object-fit:cover;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
  }
  .emp-avatar-placeholder{
    background:var(--paper);color:var(--ink-soft);font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;
  }
  .emp-avatar-remove{
    position:absolute;bottom:-2px;left:-2px;width:19px;height:19px;border-radius:50%;
    background:var(--danger);color:#fff;border:none;font-size:11px;line-height:19px;padding:0;cursor:pointer;
  }
  .emp-code-cell{font-size:16px;font-weight:800;color:var(--brand-dark);}
  .emp-phone-cell{font-size:12.5px;line-height:1.7;}
  .emp-phone-link{color:var(--brand);text-decoration:none;direction:ltr;display:inline-block;}
  .emp-phone-link:hover{text-decoration:underline;}
  .emp-joindate-cell{font-size:15.5px;font-weight:700;color:var(--ink);white-space:nowrap;}

  label{font-size:12.5px;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:5px;}

  /* ---------- شاشة تسجيل الدخول ---------- */
  .login-gate{
    position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;
    background:
      radial-gradient(circle at 20% 15%, rgba(201,123,61,.35) 0%, transparent 50%),
      radial-gradient(circle at 85% 85%, rgba(122,90,168,.30) 0%, transparent 50%),
      linear-gradient(150deg, #0F2622 0%, #1B3A34 45%, #234A42 75%, #2B5F5A 100%);
  }
  .login-card{
    background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.5);border-radius:20px;
    padding:38px 34px 32px;max-width:380px;width:100%;text-align:center;
    box-shadow:0 25px 60px -10px rgba(0,0,0,.45), 0 2px 10px rgba(0,0,0,.15);
    animation:loginPop .35s ease;
    backdrop-filter:blur(6px);
  }
  @keyframes loginPop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .login-logo-wrap{
    width:84px;height:84px;border-radius:50%;background:#fff;margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(20,40,35,.15), inset 0 0 0 1px var(--line);
  }
  .login-logo{width:64px;height:64px;object-fit:contain;border-radius:50%;}
  .login-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;color:var(--brand-dark);margin-bottom:5px;}
  .login-sub{font-size:13px;color:var(--ink-soft);margin-bottom:26px;}
  .login-input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;
    font-family:'Tajawal',sans-serif;font-size:14.5px;background:var(--paper);color:var(--ink);
    margin-bottom:16px;transition:.15s;
  }
  .login-input:focus{outline:none;border-color:var(--brand);background:var(--card);box-shadow:0 0 0 3px rgba(43,95,90,.1);}
  .login-btn{
    width:100%;padding:13px;border:none;border-radius:11px;cursor:pointer;
    background:linear-gradient(120deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;
    font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;margin-top:4px;
    box-shadow:0 6px 16px rgba(27,58,52,.25);transition:.15s;
  }
  .login-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .login-btn:active{transform:translateY(0);}
  .login-error{color:var(--danger);font-size:12.5px;margin-top:14px;display:none;font-weight:700;}
  input,select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font-family:'Tajawal',sans-serif;font-size:14px;background:var(--card);color:var(--ink);
  }
  textarea{resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .btn{
    background:var(--brand);color:#fff;border:none;border-radius:8px;
    padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;height:39px;
  }
  .btn:hover{background:var(--brand-dark);}
  .btn.secondary{background:#E2E7E4;color:var(--ink);}
  .btn.secondary:hover{background:#D5DBD7;}
  .btn.danger-outline{background:transparent;border:1px solid var(--danger);color:var(--danger);padding:6px 10px;font-size:12.5px;height:auto;}
  .btn.danger-outline:hover{background:var(--danger-soft);}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:16px;padding:4px 6px;}
  .icon-btn:hover{color:var(--danger);}

  .type-toggle{display:flex;gap:8px;}
  .type-toggle button{
    flex:1;padding:9px 6px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--card);cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-soft);
  }
  .type-toggle button.sel{border-color:var(--brand);color:var(--brand-dark);background:var(--success-soft);}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .filters select,.filters input{width:auto;min-width:130px;}
  .search-field,.emp-field{width:320px;max-width:100%;flex:none;}
  .search-field input,.emp-field input[type="text"]{width:100%;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--brand-dark);color:#fff;padding:11px 22px;border-radius:8px;
    font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;bottom:30px;}

  .loading{padding:60px;text-align:center;color:var(--ink-soft);}
  .app-footer{max-width:1100px;margin:22px auto 12px;margin-right:calc(190px + 16px);padding:16px 16px 0;text-align:center;border-top:1px solid var(--line);}

      font-weight:800;font-size:15px;cursor:pointer;margin-bottom:10px;

  .roster-alex-picker{

function compareVal(a,b){
  const as = String(a).trim(), bs = String(b).trim();
  const numA = as!=='' && /^\d+(\.\d+)?$/.test(as);
  const numB = bs!=='' && /^\d+(\.\d+)?$/.test(bs);
  if(numA && numB) return parseFloat(as) - parseFloat(bs);
  return as.localeCompare(bs, 'ar');
}
function toggleSort(state, col){
  if(state.col===col){ state.dir *= -1; } else { state.col=col; state.dir=1; }
}
function sortArrow(state, col){
  if(state.col!==col) return '<span style="opacity:.35;">↕</span>';
  return state.dir===1 ? '<span style="color:var(--brand);">↑</span>' : '<span style="color:var(--brand);">↓</span>';
}
function setEmpSort(col){ toggleSort(empSortState, col); render(); }
function setRecentLeaveSort(col){ toggleSort(recentLeaveSortState, col); render(); }
function setLogSort(col){ toggleSort(logSortState, col); applyLogFilters(); }
function setReportSort(col){ toggleSort(reportSortState, col); render(); }

function slug(t){ return t.replace(/\s+/g,'-'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateFmtShort(d){ return `${d.getDate()}/${d.getMonth()+1}`; }
function fmtDateAr(isoStr){
  if(!isoStr) return '';
  const [y,m,d] = isoStr.split('-');
  return `${parseInt(d,10)}/${parseInt(m,10)}/${y}`;
}
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){ return fmtDate(new Date()); }
function inRange(dateStr, start, end){
  const d = parseDate(dateStr);
  return d>=start && d<=end;
}
function countFridays(start, end){
  let c=0; const d=new Date(start);
  while(d<=end){ if(d.getDay()===5) c++; d.setDate(d.getDate()+1); }
  return c;
}
function getSaturdayOf(date){
  const d = new Date(date);
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diff = (dow - 6 + 7) % 7;
  d.setDate(d.getDate()-diff);
  d.setHours(0,0,0,0);
  return d;
}
function weekNumberFor(saturday){
  const diffDays = Math.round((saturday - WEEK_ANCHOR_DATE)/(1000*60*60*24));
  return WEEK_ANCHOR_NUMBER + Math.round(diffDays/7);
}
function weekKeyFor(refDate){ return fmtDate(getSaturdayOf(refDate)); }
function getWeekSnapshot(weekKey){
  // كل أسبوع له نسخته الخاصة. لو الأسبوع ده لسه معملهوش حد أي تغيير، بنورّي أقرب أسبوع سابق كنقطة بداية بس من غير ما نلمس بياناته
  if(weeklyRoster[weekKey]) return weeklyRoster[weekKey];
  const priorKeys = Object.keys(weeklyRoster).filter(k => k < weekKey).sort();
  if(priorKeys.length===0) return {};
  return weeklyRoster[priorKeys[priorKeys.length-1]];
}
function materializeWeek(weekKey){
  if(!weeklyRoster[weekKey]){
    // انسخ ورديات الأسبوع السابق فقط كنقطة بداية.
    // جدول الجمعة لا ينتقل تلقائيًا من أسبوع لآخر؛ لكل جمعة بياناتها المستقلة.
    const prior = getWeekSnapshot(weekKey);
    const copy = Object.assign({}, prior || {});
    delete copy.__friday;
    weeklyRoster[weekKey] = copy;
  }
  return weeklyRoster[weekKey];
}

function getFridaySnapshot(weekKey){
  const snap = weeklyRoster[weekKey];
  if(!snap || !snap.__friday || typeof snap.__friday !== 'object') return {};
  return snap.__friday;
}
function currentShiftOf(empId){
  return getWeekSnapshot(weekKeyFor(new Date()))[empId] || null;
}
function factoryColor(name){
  const idx = FACTORIES.indexOf(name);
  return FACTORY_COLORS[idx>=0 ? idx % FACTORY_COLORS.length : 0];
}
function rankColor(rank){
  const map = {
    'مهندس':'var(--type3)',
    'كبير مشرفين':'var(--brand-dark)',
    'مشرف':'var(--danger)',
    'مساعد مشرف':'var(--brand)',
    'مشغل':'var(--accent)'
  };
  return map[rank] || 'var(--ink-soft)';
}

let currentUser = null; // {id, employeeCode, role, displayName}
const SESSION_KEY = 'hr-session';
function loadSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
  catch(err){ return null; }
}
function saveSession(u){
  currentUser = u;
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(u)); }catch(err){}
}
function clearSession(){
  currentUser = null;
  try{ localStorage.removeItem(SESSION_KEY); }catch(err){}
}
// الأدوار: admin (كل حاجة + الصلاحيات) / editor (كل حاجة ما عدا إدارة
// المستخدمين) / leave_registrar (تسجيل إجازة جديدة بس + مشاهدة) / viewer (مشاهدة بس)
function can(action){
  if(!currentUser) return false;
  const role = currentUser.role;
  if(role==='admin') return true;
  if(role==='editor') return action !== 'manage_users';
  if(role==='leave_registrar') return action === 'add_leave';
  return false; // viewer
}
function requirePermission(action){
  if(can(action)) return true;
  showToast('⛔ معندكش صلاحية تعمل الحاجة دي');
  return false;
}
// سجل النشاط: أي تسجيل/تعديل/حذف بيتسجّل هنا مع كود واسم اللي عمله ووقته.
// مش بنستنى الرد (fire-and-forget) عشان تسجيل النشاط مايبطّئش أي حاجة، ولو
// فشل مش بيوقف العملية الأساسية.
function logActivity(description){
  if(!currentUser) return;
  try{
    sb.from('activity_log').insert({
      actor_code: currentUser.employeeCode,
      actor_name: currentUser.displayName || currentUser.employeeCode,
      description
    });
  }catch(err){}
}

async function loginUser(employeeCode, password){
  try{
    const { data, error } = await sb.rpc('login_user', {p_employee_code: employeeCode, p_password: password});
    if(error) throw error;
    if(!data || data.length===0) return false;
    const row = data[0];
    saveSession({id:row.id, employeeCode:row.employee_code, role:row.role, displayName:row.display_name});
    return true;
  }catch(err){
    return false;
  }
}
function logoutUser(){
  clearSession();
  location.reload();
}

// إدارة مستخدمين) — عكس promptChangeUserPassword اللي للأدمن يغيّر لأي حد.
async function changeOwnPassword(){
  if(!currentUser) return;
  const pass = prompt('اكتب كلمة السر الجديدة بتاعتك:');
  if(!pass) return;
  try{
    const { error } = await sb.rpc('update_user_password', {p_user_id: currentUser.id, p_new_password: pass});
    if(error) throw error;
    showToast('تم تغيير كلمة السر بنجاح');
  }catch(err){
    showToast('حصل خطأ في تغيير كلمة السر');
  }
}

function rowToEmployee(r){
  return {
    id:r.id, name:r.name, code:r.code||'', status:r.status, factory:r.factory, rank:r.rank,
    shift:r.shift||'', shiftOrder:r.shift_order??null, worksFriday:!!r.works_friday,
    fridayShift:r.friday_shift||'', fridayShiftOrder:r.friday_shift_order??null,
    joinDate:r.join_date||'', phone1:r.phone1||'', phone2:r.phone2||''
  };
}
function employeeToRow(e){
  return {
    id:e.id, name:e.name, code:e.code||null, status:e.status, factory:e.factory, rank:e.rank,
    shift:e.shift||null, shift_order:(e.shiftOrder===undefined||e.shiftOrder===null)?null:e.shiftOrder,
    works_friday: e.worksFriday===undefined? null : !!e.worksFriday,
    friday_shift:e.fridayShift||null, friday_shift_order:(e.fridayShiftOrder===undefined||e.fridayShiftOrder===null)?null:e.fridayShiftOrder,
    join_date:e.joinDate||null, phone1:e.phone1||null, phone2:e.phone2||null
  };
}
function rowToLeave(r){ return {id:r.id, employeeId:r.employee_id, type:r.type, date:r.date, note:r.note||''}; }
function leaveToRow(l){ return {id:l.id, employee_id:l.employeeId, type:l.type, date:l.date, note:l.note||''}; }
function rowToTransfer(r){ return {id:r.id, employeeId:r.employee_id, type:r.type, date:r.date, fromFactory:r.from_factory, toFactory:r.to_factory, note:r.note||''}; }
function transferToRow(t){ return {id:t.id, employee_id:t.employeeId, type:t.type||null, date:t.date||null, from_factory:t.fromFactory||null, to_factory:t.toFactory||null, note:t.note||''}; }
function rowToCitation(r){ return {id:r.id, employeeId:r.employee_id, kind:r.kind, amount:r.amount, reason:r.reason||'', date:r.date}; }
function citationToRow(c){ return {id:c.id, employee_id:c.employeeId, kind:c.kind, amount:(c.amount===undefined||c.amount===null||c.amount==='')?null:c.amount, reason:c.reason||null, date:c.date||null}; }

// دايمًا فيه اتصال — مفيش رابط مزامنة لازم تظبطه، الابليكيشن متوصّل بـSupabase طول الوقت.
async function pullFromRemote(manual){
  try{
    setSyncStatus('جارِ جلب آخر تحديث…');
    const [empQ, leavesQ, transfersQ, citationsQ, meetingsQ, alexOrderQ, settingsQ, alexWeeklyQ, weeklyRosterQ] = await Promise.all([
      sb.from('employees').select('*'),
      sb.from('leaves').select('*'),
      sb.from('transfers').select('*'),
      sb.from('citations').select('*'),
      sb.from('meeting_groups').select('*'),
      sb.from('alex_order').select('*').eq('id',1).maybeSingle(),
      sb.from('app_settings').select('*').eq('key','alexStartWeek').maybeSingle(),
      sb.from('alex_weekly').select('*'),
      sb.from('weekly_roster').select('*'),
    ]);
    const firstErr = [empQ,leavesQ,transfersQ,citationsQ,meetingsQ,alexOrderQ,settingsQ,alexWeeklyQ,weeklyRosterQ].find(q=>q.error);
    if(firstErr) throw firstErr.error;

    employees = (empQ.data||[]).map(rowToEmployee);
    leaves = (leavesQ.data||[]).map(rowToLeave);
    transfers = (transfersQ.data||[]).map(rowToTransfer);
    citations = (citationsQ.data||[]).map(rowToCitation);
    meetingGroups = (meetingsQ.data||[]).map(m=>({id:m.id, title:m.title, rows:m.rows||[]}));
    if(alexOrderQ.data) alexandriaOrder = alexOrderQ.data.data || [];
    if(settingsQ.data && (settingsQ.data.value || settingsQ.data.value===0)) alexStartWeek = settingsQ.data.value;
    const aw = {}; (alexWeeklyQ.data||[]).forEach(r=>{ aw[r.week_key] = r.data; }); alexandriaWeekly = aw;
    const wr = {}; (weeklyRosterQ.data||[]).forEach(r=>{ wr[r.week_key] = r.data; }); weeklyRoster = wr;

    localStorage.setItem(STORAGE_KEY_EMP, JSON.stringify(employees));
    localStorage.setItem(STORAGE_KEY_LEAVES, JSON.stringify(leaves));
    localStorage.setItem(STORAGE_KEY_TRANSFERS, JSON.stringify(transfers));
    localStorage.setItem(STORAGE_KEY_CITATIONS, JSON.stringify(citations));
    localStorage.setItem(STORAGE_KEY_ALEX, JSON.stringify(alexandriaWeekly));
    localStorage.setItem(STORAGE_KEY_MEETINGS, JSON.stringify(meetingGroups));
    localStorage.setItem(STORAGE_KEY_ALEX_ORDER, JSON.stringify(alexandriaOrder));
    localStorage.setItem(STORAGE_KEY_ALEX_START, String(alexStartWeek));
    localStorage.setItem(STORAGE_KEY_WEEKLY_ROSTER, JSON.stringify(weeklyRoster));
    setSyncStatus('متزامن ✓ — آخر تحديث الآن', 'ok');
    render();
    if(manual) showToast('تم تحديث البيانات من المزامنة');
  }catch(err){
    setSyncStatus('تعذّر الاتصال بالمزامنة — بيانات الجهاز فقط', 'err');
  }
}

let pushInFlight = false;
let pushQueuedAgain = false;
async function pushToRemote(){
  if(pushInFlight){ pushQueuedAgain = true; return; }
  pushInFlight = true;
  try{ await pushOnce(); }
  finally{
    pushInFlight = false;
    if(pushQueuedAgain){ pushQueuedAgain = false; pushToRemote(); }
  }
}
async function pushOnce(){
  try{
    setSyncStatus('جارِ المزامنة…');
    const jobs = [];
    jobs.push(sb.from('employees').upsert(employees.map(employeeToRow)));
    jobs.push(sb.from('leaves').upsert(leaves.map(leaveToRow)));
    jobs.push(sb.from('transfers').upsert(transfers.map(transferToRow)));
    jobs.push(sb.from('citations').upsert(citations.map(citationToRow)));
    jobs.push(sb.from('meeting_groups').upsert(meetingGroups.map(m=>({id:m.id, title:m.title, rows:m.rows||[]}))));
    jobs.push(sb.from('alex_order').upsert({id:1, data:alexandriaOrder}));
    jobs.push(sb.from('app_settings').upsert({key:'alexStartWeek', value:alexStartWeek}));
    const awRows = Object.keys(alexandriaWeekly).map(k=>({week_key:k, data:alexandriaWeekly[k]}));
    if(awRows.length) jobs.push(sb.from('alex_weekly').upsert(awRows));
    const results = await Promise.all(jobs);
    const firstErr = results.find(r=>r && r.error);
    if(firstErr) throw firstErr.error;
    setSyncStatus('تمت المزامنة ✓', 'ok');
  }catch(err){
    setSyncStatus('تعذّرت المزامنة — هيتحفظ على الجهاز ده بس', 'err');
    showToast('❌ تعذّرت المزامنة مع السيرفر — التعديل محفوظ على الجهاز ده بس دلوقتي، تأكد من النت وحاول "تحديث"');
  }
}

function resizeImageToDataUrl(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image failed'));
      img.onload = ()=>{
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        const canvas = document.createElement('canvas');
        canvas.width = maxSize; canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  pending[employeeId] = action==='set' ? {action:'set', dataUrl} : {action:'delete'};

}
// بيحاول يبعت أي تعديلات صور اتأجلت بسبب فشل في النت. بينادى تلقائي أول ما
// النت يرجع، وكمان في بداية التطبيق وعند "مزامنة الآن".
async function flushPendingPhotos(){
  const pending = loadPendingPhotoActions();
  const ids = Object.keys(pending);
  if(ids.length===0) return;
  for(const id of ids){
    const item = pending[id];
    let ok;
    if(item.action==='set') ok = await pushPhotoToRemote(id, item.dataUrl);
    else ok = await deletePhotoRemote(id);
    if(ok) clearPhotoPending(id);
  }
}
window.addEventListener('online', flushPendingPhotos);

async function handlePhotoUpload(employeeId, file){
  if(!requirePermission('edit_data')) return;
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('لازم تختار صورة'); return; }
  try{
    const dataUrl = await resizeImageToDataUrl(file, 160);
    employeePhotos[employeeId] = dataUrl;
    await savePhotos();
    render();
    const synced = await pushPhotoToRemote(employeeId, dataUrl);
    if(synced){
      clearPhotoPending(employeeId);
      showToast('تم حفظ الصورة ومزامنتها');
      logActivity(`رفع صورة لـ${empName(employeeId)}`);
    }else{
      markPhotoPending(employeeId, 'set', dataUrl);
      showToast('تعذّر الاتصال — الصورة محفوظة على الجهاز ده وهتتزامن تلقائي أول ما النت يرجع');
    }

    showToast('حصلت مشكلة في تحميل الصورة — جرّب تاني');
  }
}

async function pushPhotoToRemote(employeeId, dataUrl){
  try{
    const { error } = await sb.from('photos').upsert({employee_id:employeeId, data_url:dataUrl});
    if(error) throw error;
    return true;
  }catch(err){
    return false;
  }
}
async function deletePhotoRemote(employeeId){
  try{
    const { error } = await sb.from('photos').delete().eq('employee_id', employeeId);
    if(error) throw error;
    return true;
  }catch(err){
    return false;
  }
}
// بيجيب كل صور الموظفين اللي زمّلاءك رفعوها على أجهزة تانية — بيتنادى مرة عند فتح الصفحة،
// ومرة كمان لو دُست "مزامنة الآن" يدويًا. مش بيتنادى مع كل حفظ عادي عشان يفضل سريع.
async function pullPhotosFromRemote(manual){
  try{
    const { data, error } = await sb.from('photos').select('*');
    if(error) throw error;
    const map = {};
    (data||[]).forEach(r=>{ map[r.employee_id] = r.data_url; });
    // استبدال كامل، مش دمج — لو حد مسح صورة من جهاز تاني، لازم تتمسح عندك
    // كمان. الدمج كان بيخلي الصور المحذوفة ترجع تاني على أي جهاز تاني.
    employeePhotos = map;
    await savePhotos();
    render();
    if(manual) showToast('تم تحديث الصور');
  }catch(err){
    // فشل جلب الصور مش مشكلة حرجة زي فشل جلب باقي البيانات، فبنسيبها تفضل زي ما هي
  }
}

/* ---------- تتبّع الأسابيع المعلّقة (لو فشل حفظها وقت مافيش نت) ---------- */
// قائمة الأسابيع اللي اتعدّلت محليًا ولسه ما اتأكدش وصولها للسيرفر — بتخزن
// المحتوى الفعلي (مش بس اسم الأسبوع)، عشان نقدر نرجّعه لو السحب من السيرفر
// جاب نسخة أقدم فوقه بالغلط.
const STORAGE_KEY_WEEK_PENDING = 'hr-weeks-pending';
function loadPendingWeeks(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY_WEEK_PENDING)||'{}'); }catch(err){ return {}; }
}
function markWeekPending(weekKey, data){
  const p = loadPendingWeeks();
  p[weekKey] = data;
  try{ localStorage.setItem(STORAGE_KEY_WEEK_PENDING, JSON.stringify(p)); }catch(err){}
}
function clearWeekPending(weekKey){
  const p = loadPendingWeeks();
  if(weekKey in p){ delete p[weekKey]; try{ localStorage.setItem(STORAGE_KEY_WEEK_PENDING, JSON.stringify(p)); }catch(err){} }
}
async function flushPendingWeeks(){
  const pending = loadPendingWeeks();
  const keys = Object.keys(pending);
  if(keys.length===0) return;
  for(const wk of keys){
    try{
      const { error } = await sb.from('weekly_roster').upsert({week_key:wk, data: pending[wk] || {}});
      if(!error) clearWeekPending(wk);
    }catch(err){ /* هيفضل معلّق، هنحاول تاني بعدين */ }
  }
}
// بعد أي سحب من السيرفر، لو لسه في أسابيع معلّقة (فشلت حتى بعد إعادة
// المحاولة)، نرجّع نسختها المحلية فوق اللي جاي من السيرفر — عشان السحب
// مايمسحش تعديل محلي لسه ما اتأكدش وصوله.
function reapplyPendingWeeksLocally(){
  const pending = loadPendingWeeks();
  const keys = Object.keys(pending);
  if(keys.length===0) return;
  keys.forEach(wk=>{ weeklyRoster[wk] = pending[wk]; });
  try{ localStorage.setItem(STORAGE_KEY_WEEKLY_ROSTER, JSON.stringify(weeklyRoster)); }catch(err){}
  showToast(`تم استرجاع ${keys.length===1?'أسبوع كان':'عدد '+keys.length+' أسابيع كانت'} لسه ما اتزامنش — هيعاد المحاولة`);
}
window.addEventListener('online', flushPendingWeeks);

function empDisplayLabel(e){

function filterEmpSuggestions(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return employees.slice(0,8);
  return employees.filter(e=>
    e.name.toLowerCase().includes(q) || (e.code||'').toLowerCase().includes(q)
  ).slice(0,8);
}
function renderEmpSuggestions(list){
  renderEmpSuggestionsInto('empSuggest', list, selectEmpFromSuggest);
}
function renderEmpSuggestionsInto(boxId, list, onPickId){
  const box = document.getElementById(boxId);
  if(!box) return;
  if(list.length===0){
    box.innerHTML = `<div class="emp-suggest-empty">مفيش نتائج مطابقة</div>`;
    box.style.display = 'block';
    return;
  }
  box.innerHTML = list.map(e=>`
    <div class="emp-suggest-item" data-id="${e.id}">
      <span class="emp-suggest-name">${escapeHtml(e.name)}</span>
      <span class="emp-suggest-meta">${e.factory? escapeHtml(e.factory):''}${e.code? ' • '+escapeHtml(e.code):''}</span>
    </div>
  `).join('');
  box.style.display = 'block';
  box.querySelectorAll('.emp-suggest-item').forEach(item=>{
    item.addEventListener('mousedown', (ev)=>{
      ev.preventDefault();
      onPickId(item.dataset.id);
    });
  });
}
/**
 * Adds a suggestion dropdown to an existing free-text filter box (the box already has its
 * own oninput handler that filters a list). Picking a suggestion fills the box with that
 * employee's name and re-runs the same filter — no new field, just a picker on top of the
 * one that's already there.
 */
function attachSearchSuggestions(inputId, suggestId, stateSetter, refreshFn){
  const input = document.getElementById(inputId);
  const box = document.getElementById(suggestId);
  if(!input || !box) return;
  const showSug = ()=> renderEmpSuggestionsInto(suggestId, filterEmpSuggestions(input.value), (id)=>{
    const e = employees.find(x=>x.id===id);
    if(!e) return;
    input.value = e.name;
    stateSetter(e.name);
    box.style.display = 'none';
    refreshFn();
  });
  input.addEventListener('focus', showSug);
  input.addEventListener('input', showSug);
  input.addEventListener('blur', ()=>{ setTimeout(()=>{ box.style.display='none'; }, 150); });
}
/**
 * Wires up a "type name or code" employee picker: a text input (searchId) that shows a
 * live suggestion dropdown (suggestId), optionally writing the chosen id into a hidden
 * field (hiddenId), and calling onSelect(employee) once a pick is made. Same pattern used
 * everywhere an employee needs to be selected (leave form, log filter, Alexandria picks...).
 */
function initEmpAutocomplete(searchId, hiddenId, suggestId, onSelect){
  const searchInput = document.getElementById(searchId);
  const hiddenInput = hiddenId ? document.getElementById(hiddenId) : null;
  const box = document.getElementById(suggestId);
  if(!searchInput || !box) return;
  const pick = (id)=>{
    const e = employees.find(x=>x.id===id);
    if(!e) return;
    if(hiddenInput) hiddenInput.value = e.id;
    searchInput.value = empDisplayLabel(e);
    box.style.display = 'none'; box.innerHTML = '';
    if(onSelect) onSelect(e);
  };
  searchInput.addEventListener('input', ()=>{
    if(hiddenInput) hiddenInput.value = '';
    renderEmpSuggestionsInto(suggestId, filterEmpSuggestions(searchInput.value), pick);
  });
  searchInput.addEventListener('focus', ()=>{
    renderEmpSuggestionsInto(suggestId, filterEmpSuggestions(searchInput.value), pick);
  });
  searchInput.addEventListener('blur', ()=>{
    setTimeout(()=>{ box.style.display = 'none'; }, 150);
  });
  searchInput.addEventListener('keydown', (ev)=>{
    if(ev.key!=='Enter') return;
    ev.preventDefault();
    const q = searchInput.value.trim().toLowerCase();
    if(!q) return;
    const exact = employees.find(e=>(e.code||'').toLowerCase()===q);
    const list = filterEmpSuggestions(searchInput.value);
    const chosen = exact || list[0];
    if(chosen) pick(chosen.id);
  });
}
function selectEmpFromSuggest(id){
  const e = employees.find(x=>x.id===id);
  if(!e) return;
  const hidden = document.getElementById('lEmp');
  const search = document.getElementById('lEmpSearch');
  if(hidden) hidden.value = e.id;
  if(search) search.value = empDisplayLabel(e);
  const box = document.getElementById('empSuggest');
  if(box){ box.style.display = 'none'; box.innerHTML = ''; }
}
function leaveCountsFor(empId){
  const counts = {}; LEAVE_TYPES.forEach(t=>counts[t]=0);
  leaves.filter(l=>l.employeeId===empId).forEach(l=>{ counts[l.type] = (counts[l.type]||0)+1; });
  return counts;
}

// اللي بيسافر الإسكندرية بيسافر الخميس ويرجع الخميس اللي بعده — يعني الجمعة
// والسبت بعد رجوعه بيبقوا راحة زيادة عن المعتاد. عشان كده الشهر اللي سافر فيه،
// سقف الراحة بتاعه لازم يزيد يوم، وإلا هيبان وكأنه تعدى السقف وهو ماشي صح.
function getAlexTravelerIdsInMonth(yearMonth){
  const ids = new Set();
  const [y,m] = yearMonth.split('-').map(Number);
  const monthStart = new Date(y, m-1, 1);
  const monthEnd = new Date(y, m, 0);
  let cursor = getSaturdayOf(monthStart);
  cursor.setDate(cursor.getDate()-7);
  for(let i=0;i<8;i++){
    const thursday = new Date(cursor); thursday.setDate(cursor.getDate()+5);
    if(thursday>=monthStart && thursday<=monthEnd){
      const weekKey = fmtDate(cursor);
      const weekNo = weekNumberFor(cursor);
      const disp = getAlexDisplayForWeek(weekKey, weekNo);
      disp.people.forEach(p=>{ if(p.id) ids.add(p.id); });
    }
    cursor = new Date(cursor); cursor.setDate(cursor.getDate()+7);
  }
  return ids;
}
function getAlexTravelerIdsInRange(start, end){
  const ids = new Set();
  const cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  const endMonth = new Date(end.getFullYear(), end.getMonth(), 1);
  while(cursor<=endMonth){
    const key = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`;
    getAlexTravelerIdsInMonth(key).forEach(id=>ids.add(id));
    cursor.setMonth(cursor.getMonth()+1);
  }
  return ids;
}
function getDashCapWarnings(){
  const thisMonth = todayStr().slice(0,7);
  const [y,m] = thisMonth.split('-').map(Number);
  const monthStart = new Date(y, m-1, 1);
  const monthEnd = new Date(y, m, 0);
  const rahaCap = countFridays(monthStart, monthEnd);
  if(!rahaCap) return [];
  const alexIds = getAlexTravelerIdsInMonth(thisMonth);
  const warnings = [];
  employees.forEach(e=>{
    const cap = rahaCap + (alexIds.has(e.id) ? 1 : 0);
    const used = leaves.filter(l=>l.employeeId===e.id && l.type==='راحة' && l.date.slice(0,7)===thisMonth).length;
    if(used>cap) warnings.push({emp:e, used, cap, over: true});
  });
  return warnings.sort((a,b)=> (b.used-b.cap)-(a.used-a.cap));
}
function getFactoryLeavesThisMonth(){
  const thisMonth = todayStr().slice(0,7);
  const monthLeaves = leaves.filter(l=>l.date.slice(0,7)===thisMonth);
  return FACTORIES.map(f=>{
    const val = monthLeaves.filter(l=>{
      const e = employees.find(x=>x.id===l.employeeId);
      return e && e.factory===f;
    }).length;
    return {label:f, val, color:factoryColor(f)};
  }).sort((a,b)=>b.val-a.val);
}
function getTopLeaveTakers(limit){
  const thisMonth = todayStr().slice(0,7);
  const counts = {};
  leaves.filter(l=>l.date.slice(0,7)===thisMonth).forEach(l=>{
    counts[l.employeeId] = (counts[l.employeeId]||0)+1;
  });
  return Object.entries(counts)
    .map(([id,val])=>({emp:employees.find(e=>e.id===id), val}))
    .filter(x=>x.emp)
    .sort((a,b)=>b.val-a.val)
    .slice(0, limit||5)
    .map(x=>({label:x.emp.name, val:x.val, color:factoryColor(x.emp.factory)}));
}

// نظام الراحات عندنا: الدائم بس هو اللي راحته مدفوعة الأجر. المؤقت واللي
// تحت الاختبار برضو بياخدوا نفس عدد الراحات (عدد جمعات الشهر) — بس على
// حسابهم هما (مش مدفوعة). يعني الفرق بينهم مش "بياخد راحة ولا لأ"، الفرق
// إن راحة الدائم مدفوعة وراحتهم هما لأ. عشان كده بنعمل تحليلين منفصلين:
// واحد للدائم (راحة مدفوعة)، وواحد للمؤقت وتحت الاختبار (راحة على حسابهم)
// — الاتنين بيتحسبوا على نفس الأساس (الأسبوع الحالي، نوع "راحة" بس).
function getPermanentWithoutRestThisWeek(weekSat, weekFri){
  const restTakenIds = new Set(
    leaves.filter(l=>l.type==='راحة' && inRange(l.date, weekSat, weekFri)).map(l=>l.employeeId)
  );
  return employees.filter(e=>e.status==='دائم' && !restTakenIds.has(e.id))
    .sort((a,b)=>compareVal(a.name,b.name));
}
function getNonPermanentWithoutRestThisWeek(weekSat, weekFri){
  const restTakenIds = new Set(
    leaves.filter(l=>l.type==='راحة' && inRange(l.date, weekSat, weekFri)).map(l=>l.employeeId)
  );
  return employees.filter(e=>e.status!=='دائم' && !restTakenIds.has(e.id))
    .sort((a,b)=>compareVal(a.name,b.name));
}
// بدل عرض أسماء المؤقت وتحت الاختبار، نسبة مين اخد راحته الأسبوع ده مقارنة
// بالدائم — أنسب لعدد كبير من الأسماء.
function getRestRatioStats(weekSat, weekFri){
  const restTakenIds = new Set(
    leaves.filter(l=>l.type==='راحة' && inRange(l.date, weekSat, weekFri)).map(l=>l.employeeId)
  );
  const perm = employees.filter(e=>e.status==='دائم');
  const temp = employees.filter(e=>e.status!=='دائم');
  const permTaken = perm.filter(e=>restTakenIds.has(e.id)).length;
  const tempTaken = temp.filter(e=>restTakenIds.has(e.id)).length;
  return {
    totalTaken: permTaken+tempTaken, totalEmps: perm.length+temp.length,
    permTaken, permTotal: perm.length, permPct: perm.length? Math.round(permTaken/perm.length*100):0,
    tempTaken, tempTotal: temp.length, tempPct: temp.length? Math.round(tempTaken/temp.length*100):0,
  };
}

  else if(currentTab==='reports') panel.innerHTML = renderReports();

  else if(currentTab==='meeting') panel.innerHTML = renderMeeting();
  else if(currentTab==='emp') panel.innerHTML = renderEmp();
  else if(currentTab==='leave') panel.innerHTML = renderLeaveForm();

  else if(currentTab==='settings') panel.innerHTML = renderSettings();
  attachHandlers();

  const userBadge = document.getElementById('currentUserBadge');
  if(userBadge && currentUser){
    const roleLabels = {admin:'أدمن', editor:'محرر كامل', leave_registrar:'تسجيل إجازة', viewer:'مشاهدة فقط'};
    const linkedEmp = employees.find(e=>e.code && e.code===currentUser.employeeCode);

      ? `<img src="${photoUrl}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid var(--line);">`
      : `👤`;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && el.tagName==='INPUT'){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(err){}
      }
    }
  }
}

function donutChartHTML(parts, total, big){
  let cumulative = 0;
  const stops = [];
  parts.forEach(p=>{
    if(p.val<=0) return;
    const start = total>0 ? (cumulative/total*360) : 0;
    cumulative += p.val;
    const end = total>0 ? (cumulative/total*360) : 0;
    stops.push(`${p.color} ${start}deg ${end}deg`);
  });
  const gradient = stops.length ? stops.join(', ') : 'var(--line) 0deg 360deg';
  const legend = parts.map(p=>{
    const pct = total>0 ? Math.round(p.val/total*100) : 0;
    return `
    <div class="row">
      <span class="lbl"><span class="dot" style="background:${p.color};"></span>${p.label}</span>
      <span class="row-right"><b>${p.val}</b>${big?`<span class="pct">${pct}%</span>`:''}</span>
    </div>
  `;}).join('');
  return `
    <div class="donut-row${big?' big':''}">
      <div class="donut${big?' big':''}" style="background:conic-gradient(${gradient});">
        <div class="donut-hole"><span class="tot-n">${total}</span><span class="tot-l">إجمالي</span></div>
      </div>
      <div class="donut-legend${big?' big':''}">${legend}</div>
    </div>
  `;
}

}

/* ---------- REPORTS ---------- */
function getPeriodRange(){
  if(reportPeriod==='custom'){
    let start = parseDate(reportCustomStart);
    let end = parseDate(reportCustomEnd);
    if(end < start){ const t=start; start=end; end=t; }
    start.setHours(0,0,0,0); end.setHours(0,0,0,0);
    const dates=[]; const cur = new Date(start);
    while(cur<=end){ dates.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
    const label = `${start.getDate()}/${start.getMonth()+1}/${start.getFullYear()} → ${end.getDate()}/${end.getMonth()+1}/${end.getFullYear()}`;
    return {start,end,dates,label};
  }
  if(reportPeriod==='week'){
    const dow = reportRefDate.getDay();
    const diff = (dow - 6 + 7) % 7;
    const start = new Date(reportRefDate); start.setDate(start.getDate()-diff); start.setHours(0,0,0,0);
    const end = new Date(start); end.setDate(start.getDate()+6);
    const dates=[]; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); dates.push(d); }
    const label = `أسبوع ${start.getDate()}/${start.getMonth()+1} → ${end.getDate()}/${end.getMonth()+1}`;
    return {start,end,dates,label};
  }
  if(reportPeriod==='year'){
    const y = reportRefDate.getFullYear();
    const start = new Date(y,0,1); const end = new Date(y,11,31);
    const dates = []; for(let m=0;m<12;m++){ dates.push(new Date(y,m,1)); }
    return {start,end,dates,label:`سنة ${y}`};
  }
  // month
  const y = reportRefDate.getFullYear(), m = reportRefDate.getMonth();
  const start = new Date(y,m,1); const end = new Date(y,m+1,0);
  const dates = []; for(let d=1; d<=end.getDate(); d++){ dates.push(new Date(y,m,d)); }
  const label = start.toLocaleDateString('ar-EG',{month:'long', year:'numeric'});
  return {start,end,dates,label};
}
function getCaps(range){
  const caps = {};
  caps['راحة'] = countFridays(range.start, range.end);
  caps['يوم شهر'] = (reportPeriod==='month') ? 1 : (reportPeriod==='year' ? 12 : null);
  caps['راحة عيد'] = null;
  return caps;
}
function shiftReportPeriod(dir){
  if(reportPeriod==='week') reportRefDate.setDate(reportRefDate.getDate()+7*dir);
  else if(reportPeriod==='month') reportRefDate.setMonth(reportRefDate.getMonth()+dir);
  else if(reportPeriod==='year') reportRefDate.setFullYear(reportRefDate.getFullYear()+dir);
  render();
}
function setReportPeriod(p){
  reportPeriod=p;
  if(p!=='custom') reportRefDate=new Date();
  render();
}
function applyCustomReportRange(){
  const s = document.getElementById('reportCustomStartInput').value;
  const e = document.getElementById('reportCustomEndInput').value;
  if(!s || !e){ showToast('لازم تحدد تاريخ البداية والنهاية'); return; }
  reportCustomStart = s;
  reportCustomEnd = e;
  render();
}
function setReportView(v){ reportView=v; render(); }

function getFilteredReportEmployees(){
  let emps = reportFactoryFilter ? employees.filter(e=>e.factory===reportFactoryFilter) : employees;
  if(reportShiftFilter) emps = emps.filter(e=>currentShiftOf(e.id)===reportShiftFilter);
  if(reportStatusFilter) emps = emps.filter(e=>e.status===reportStatusFilter);
  if(reportSearch){
    const q = reportSearch.trim().toLowerCase();
    emps = emps.filter(e=> e.name.toLowerCase().includes(q) || (e.code||'').toLowerCase().includes(q));
  }
  return emps;
}
function renderReportSummary(range, caps){
  let emps = getFilteredReportEmployees();
  if(emps.length===0){
    return `<tr class="empty-row"><td colspan="${LEAVE_TYPES.length+3}">لا يوجد موظفين مطابقين</td></tr>`;
  }
  const alexIds = getAlexTravelerIdsInRange(range.start, range.end);
  const withCounts = emps.map(e=>{
    const empLeaves = leaves.filter(l=>l.employeeId===e.id && inRange(l.date, range.start, range.end));
    const counts = {}; LEAVE_TYPES.forEach(t=>counts[t]=0);
    empLeaves.forEach(l=>counts[l.type]=(counts[l.type]||0)+1);
    const total = LEAVE_TYPES.reduce((s,t)=>s+counts[t],0);
    return {e, counts, total};
  });
  withCounts.sort((a,b)=>{
    let av,bv;
    if(reportSortState.col==='total'){ av=a.total; bv=b.total; }
    else if(reportSortState.col==='shift'){ av=currentShiftOf(a.e.id)||''; bv=currentShiftOf(b.e.id)||''; }
    else if(LEAVE_TYPES.includes(reportSortState.col)){ av=a.counts[reportSortState.col]; bv=b.counts[reportSortState.col]; }
    else { av=a.e.name; bv=b.e.name; }
    return compareVal(av,bv)*reportSortState.dir;
  });
  return withCounts.map(({e,counts,total})=>{
    const cells = LEAVE_TYPES.map(t=>{
      let cap = caps[t];
      const isAlexAdjusted = t==='راحة' && alexIds.has(e.id) && cap!==null;
      if(isAlexAdjusted) cap = cap + 1;
      if(cap===null) return `<td>${counts[t]}</td>`;
      const over = counts[t] > cap;
      return `<td ${over?'style="color:var(--danger);font-weight:700;"':''}>${counts[t]} / ${cap}${isAlexAdjusted?' 🧳':''}</td>`;
    }).join('');
    return `<tr><td><strong class="emp-name">${escapeHtml(e.name)}</strong></td><td>${currentShiftOf(e.id)||'—'}</td>${cells}<td><strong>${total}</strong></td></tr>`;
  }).join('');
}

    return `<div class="empty-state"><div class="big">👥</div>لا يوجد موظفين مطابقين</div>`;
  }
  if(reportPeriod==='year'){
    const header = range.dates.map(d=>`<th>${d.toLocaleDateString('ar-EG',{month:'short'})}</th>`).join('');
    const rows = emps.map(e=>{
      const cells = range.dates.map(mStart=>{
        const mEnd = new Date(mStart.getFullYear(), mStart.getMonth()+1, 0);
        const dayLeaves = leaves.filter(l=>l.employeeId===e.id && inRange(l.date, mStart, mEnd));
        if(dayLeaves.length===0) return `<td class="cal-cell" style="color:var(--ink-soft);">—</td>`;
        const parts = LEAVE_TYPES.map(t=>{
          const n = dayLeaves.filter(l=>l.type===t).length;
          return n>0 ? `<span class="type-dot type-${slug(t)}" title="${t}"></span>${n}` : '';
        }).filter(Boolean).join('&nbsp;');
        return `<td class="cal-cell" style="font-size:12px;">${parts}</td>`;
      }).join('');
      return `<tr><td><strong class="emp-name">${escapeHtml(e.name)}</strong></td>${cells}</tr>`;
    }).join('');
    return `<div style="overflow-x:auto;"><table><thead><tr><th>الاسم</th>${header}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  // week or month: columns = days
  const header = range.dates.map(d=>{
    const isFri = d.getDay()===5;
    return `<th class="${isFri?'cal-fri':''}">${d.getDate()}<br><span style="font-weight:400;font-size:10px;">${d.toLocaleDateString('ar-EG',{weekday:'short'})}</span></th>`;
  }).join('');
  const rows = emps.map(e=>{
    const cells = range.dates.map(d=>{
      const ds = fmtDate(d);
      const isFri = d.getDay()===5;
      const dayLeaves = leaves.filter(l=>l.employeeId===e.id && l.date===ds);
      const cls = 'cal-cell' + (isFri?' cal-fri':'');
      if(dayLeaves.length===0) return `<td class="${cls}" style="color:var(--ink-soft);">—</td>`;
      const dots = dayLeaves.map(l=>`<span class="type-dot type-${slug(l.type)}" title="${l.type}"></span>`).join(' ');
      return `<td class="${cls}">${dots}</td>`;
    }).join('');
    return `<tr><td><strong class="emp-name">${escapeHtml(e.name)}</strong></td>${cells}</tr>`;
  }).join('');
  return `<div style="overflow-x:auto;"><table><thead><tr><th>الاسم</th>${header}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function alexMsgWeekRange(refDate){
  const saturday = getSaturdayOf(refDate);
  const thursday = new Date(saturday); thursday.setDate(saturday.getDate()+5);
  const prevSaturday = new Date(saturday); prevSaturday.setDate(saturday.getDate()-7);
  return { saturday, thursday, weekNo: weekNumberFor(saturday), key: fmtDate(saturday), prevKey: fmtDate(prevSaturday) };
}

let lastAlexOrderWeekNo = 0;
function getAutoAlexIndicesForWeek(weekNo){
  const order = alexandriaOrder;
  if(!order || order.length<2) return [];
  if((weekNo||0) < (alexStartWeek||41)) return []; // الترتيب لسه ما بداش الأسبوع ده
  const perWeek = 2;
  const totalTurns = Math.ceil(order.length/perWeek);
  const n = ((weekNo||0) - (alexStartWeek||41)) % totalTurns;
  const idx = n*perWeek;
  return [idx, idx+1];
}

function rosterWeekRange(){
  const saturday = getSaturdayOf(rosterRefDate);
  const thursday = new Date(saturday); thursday.setDate(saturday.getDate()+5);
  const friday = new Date(saturday); friday.setDate(saturday.getDate()+6);
  return { saturday, thursday, friday, weekNo: weekNumberFor(saturday), key: fmtDate(saturday) };
}
function setRosterGroup(g){ rosterGroup=g; render(); }
function shiftRosterWeek(dir){ rosterRefDate = new Date(rosterRefDate); rosterRefDate.setDate(rosterRefDate.getDate()+7*dir); render(); }
function toggleRosterFriday(){ rosterShowFriday = !rosterShowFriday; render(); }
async function setEmployeeFridayShift(id, shift){
  if(!requirePermission('edit_data')) return;
  const e = employees.find(x=>x.id===id);
  if(!e) return;

  const weekKey = rosterWeekRange().key;
  const snap = materializeWeek(weekKey);

  // جدول الجمعة خاص بالأسبوع الحالي فقط.
  if(!snap.__friday || typeof snap.__friday !== 'object'){
    snap.__friday = {};
  }

  if(shift){
    snap.__friday[id] = {
      shift: shift,
      order: Date.now()
    };
  }else{
    delete snap.__friday[id];
  }

  await saveWeeklyRoster(weekKey);
  render();
}
const ROTATE_TO = { [SHIFTS[0]]: SHIFTS[2], [SHIFTS[1]]: SHIFTS[0], [SHIFTS[2]]: SHIFTS[1] };
let lastRotationSnapshot = null; // {weekKey, group, before:{empId:shift}}
async function rotateGroupShifts(){
  if(!requirePermission('edit_data')) return;
  const weekKey = rosterWeekRange().key;
  if(!confirm(`تدوير ورديات "${rosterGroup}" لأسبوع ${rosterWeekRange().weekNo} بس (الأولى→الثالثة، الثانية→الأولى، الثالثة→الثانية)؟`)) return;
  const snap = materializeWeek(weekKey);
  lastRotationSnapshot = { weekKey, group: rosterGroup, before: Object.assign({}, snap) };
  const affected = employees.filter(e=>e.factory===rosterGroup && !PINNED_NAMES.some(p=>normalizeAr(e.name).includes(normalizeAr(p))));
  affected.forEach(e=>{
    const cur = snap[e.id];
    if(cur && ROTATE_TO[cur]) snap[e.id] = ROTATE_TO[cur];
  });
  await saveWeeklyRoster(weekKey);
  showToast(`تم تدوير ورديات أسبوع ${rosterWeekRange().weekNo} فقط`);
  logActivity(`دوّر ورديات مجموعة "${rosterGroup}" — أسبوع ${rosterWeekRange().weekNo}`);
  render();
}
async function undoRotation(){
  if(!requirePermission('edit_data')) return;
  if(!lastRotationSnapshot) return;
  weeklyRoster[lastRotationSnapshot.weekKey] = lastRotationSnapshot.before;
  const undoneWeekKey = lastRotationSnapshot.weekKey;
  lastRotationSnapshot = null;
  await saveWeeklyRoster(undoneWeekKey);
  showToast('تم التراجع عن التدوير');
  logActivity(`تراجع عن تدوير الورديات — أسبوع ${rosterWeekRange().weekNo}`);
  render();
}
async function setEmployeeShift(id, shift){
  if(!requirePermission('edit_data')) return;

  const key = rosterWeekRange().key;

function getAutoAlexEntriesForWeek(weekNo){
  const order = alexandriaOrder;
  if(!order || order.length<2) return [null, null];
  if((weekNo||0) < (alexStartWeek||41)) return [null, null]; // الترتيب لسه ما بداش الأسبوع ده
  const perWeek = 2;
  const totalTurns = Math.ceil(order.length/perWeek);
  const n = ((weekNo||0) - (alexStartWeek||41)) % totalTurns;
  const idx = n*perWeek;
  return [order[idx]||null, order[idx+1]||null];
}
function resolveAlexEntryToEmployeeId(entry){
  if(!entry) return '';
  let match = null;
  if(entry.code) match = employees.find(e=>e.code && e.code===entry.code);
  if(!match && entry.name) match = employees.find(e=>normalizeAr(e.name)===normalizeAr(entry.name));
  return match ? match.id : '';
}
function getAlexDisplayForWeek(weekKey, weekNo){
  const saved = (alexandriaWeekly[weekKey]||[]).filter(Boolean);
  if(saved.length>0){
    return { auto:false, people: saved.map(id=>employees.find(e=>e.id===id)).filter(Boolean).map(e=>({name:e.name, code:e.code||'', id:e.id})) };
  }
  const auto = getAutoAlexEntriesForWeek(weekNo).filter(Boolean);
  return { auto:true, people: auto.map(entry=>({name:entry.name, code:entry.code||'', id: resolveAlexEntryToEmployeeId(entry)||null})) };
}
function updateAlexOrderField(idx, field, value){

}
function addAlexOrderPair(){

function removeAlexOrderPair(pairIdx){
  if(!requirePermission('edit_data')) return;
  if(!confirm('تأكيد حذف الزوج ده من ترتيب الإسكندرية؟')) return;
  alexandriaOrder.splice(pairIdx*2, 2);
  saveAlexOrder();
  logActivity('حذف زوج من ترتيب الإسكندرية');
  render();
}
function moveAlexOrderPair(pairIdx, dir){
  const targetPair = pairIdx+dir;
  const totalPairs = Math.ceil(alexandriaOrder.length/2);
  if(targetPair<0 || targetPair>=totalPairs) return;
  const a = alexandriaOrder.slice(pairIdx*2, pairIdx*2+2);
  const b = alexandriaOrder.slice(targetPair*2, targetPair*2+2);
  while(a.length<2) a.push({name:'',code:''});
  while(b.length<2) b.push({name:'',code:''});
  for(let i=0;i<2;i++){ alexandriaOrder[targetPair*2+i]=a[i]; alexandriaOrder[pairIdx*2+i]=b[i]; }
  saveAlexOrder();
  render();
}

  alexandriaOrder[idx].name = emp.name;
  alexandriaOrder[idx].code = emp.code || '';
  saveAlexOrder();

/* ---------- MEETING SCHEDULE (جدول الاجتماع) — fully manual, separate from roster ---------- */
async function addMeetingGroup(){
  if(!requirePermission('edit_data')) return;
  meetingGroups.push({ id:'mg'+uid(), title:'اجتماع جديد', rows:[{name:'',code:''}] });
  await saveMeetings();
  logActivity('أضاف اجتماع جديد');
  render();
}
async function removeMeetingGroup(id){
  if(!requirePermission('edit_data')) return;
  if(!confirm('تأكيد حذف هذا الاجتماع بالكامل؟')) return;
  const g = meetingGroups.find(x=>x.id===id);
  meetingGroups = meetingGroups.filter(g=>g.id!==id);
  try{ localStorage.setItem(STORAGE_KEY_MEETINGS, JSON.stringify(meetingGroups)); }catch(err){}
  try{
    const { error } = await sb.from('meeting_groups').delete().eq('id', id);
    if(error) throw error;
    if(g) logActivity(`حذف اجتماع: ${g.title}`);
  }catch(err){
    showToast('❌ الحذف اتعمل عندك بس مش على السيرفر — تأكد من النت وحاول تاني');
  }
  render();
}
async function renameMeetingGroup(id, title){
  const g = meetingGroups.find(x=>x.id===id);
  if(g){ g.title = title; await saveMeetings(); }
}
async function addMeetingRow(groupId){
  if(!requirePermission('edit_data')) return;
  const g = meetingGroups.find(x=>x.id===groupId);
  if(g){ g.rows.push({name:'',code:''}); await saveMeetings(); render(); }
}
async function removeMeetingRow(groupId, idx){
  if(!requirePermission('edit_data')) return;
  const g = meetingGroups.find(x=>x.id===groupId);
  if(g){ g.rows.splice(idx,1); if(g.rows.length===0) g.rows.push({name:'',code:''}); await saveMeetings(); render(); }
}
async function updateMeetingCell(groupId, idx, field, value){
  const g = meetingGroups.find(x=>x.id===groupId);
  if(g && g.rows[idx]){ g.rows[idx][field] = value; await saveMeetings(); }
}
function attachMeetingRowAutocomplete(groupId, idx){
  const nameInput = document.getElementById(`meetingName_${groupId}_${idx}`);
  const codeInput = document.getElementById(`meetingCode_${groupId}_${idx}`);
  const box = document.getElementById(`meetingSuggest_${groupId}_${idx}`);
  if(!box) return;
  const pick = (id)=>{
    const e = employees.find(x=>x.id===id);
    if(!e) return;
    updateMeetingCell(groupId, idx, 'name', e.name);
    updateMeetingCell(groupId, idx, 'code', e.code||'');
    box.style.display = 'none';
    render();
  };
  const showFrom = (input)=>{
    if(!input) return;
    renderEmpSuggestionsInto(box.id, filterEmpSuggestions(input.value), pick);
  };
  [nameInput, codeInput].forEach(input=>{
    if(!input) return;
    input.addEventListener('focus', ()=>showFrom(input));
    input.addEventListener('input', ()=>showFrom(input));
    input.addEventListener('blur', ()=>{ setTimeout(()=>{ box.style.display='none'; }, 150); });
  });
}
function printMeeting(){
  window.print();
}
async function downloadMeetingImage(){
  const el = document.getElementById('meetingPrintArea');
  if(!el || typeof html2canvas==='undefined'){ showToast('تعذّر إنشاء الصورة'); return; }
  showToast('جارِ إنشاء الصورة…');
  try{
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', windowWidth:1100, windowHeight:Math.max(el.scrollHeight+80, 800)});
    const link = document.createElement('a');
    link.download = 'جدول_الاجتماع.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(err){
    showToast('تعذّر إنشاء الصورة');
  }
}

function fillLogTable(list){
  const body = document.getElementById('logBody');
  if(!body) return;
  const sorted = [...list].sort((a,b)=>{
    const ea = employees.find(x=>x.id===a.employeeId) || {};
    const eb = employees.find(x=>x.id===b.employeeId) || {};
    let av, bv;
    switch(logSortState.col){
      case 'name': av=ea.name||''; bv=eb.name||''; break;
      case 'code': av=ea.code||''; bv=eb.code||''; break;
      case 'factory': av=ea.factory||''; bv=eb.factory||''; break;
      case 'shift': av=currentShiftOf(ea.id)||''; bv=currentShiftOf(eb.id)||''; break;
      case 'type': av=a.type; bv=b.type; break;
      case 'note': av=a.note||''; bv=b.note||''; break;
      default: av=a.date; bv=b.date;
    }
    return compareVal(av,bv)*logSortState.dir;
  });
  if(sorted.length===0){
    body.innerHTML = `<tr class="empty-row"><td colspan="8">مفيش نتائج مطابقة</td></tr>`;
    return;
  }
  body.innerHTML = sorted.map(l=>{
    const e = employees.find(x=>x.id===l.employeeId);
    const isTransfer = l.type===TRANSFER_TYPE || l.type===STATUS_CHANGE_TYPE;
    const actions = isTransfer
      ? `<button class="icon-btn" title="حذف" onclick="deleteTransfer('${l.id}')">🗑</button>`
      : `<button class="icon-btn" title="تعديل" onclick="editLeave('${l.id}')">✎</button>
         <button class="icon-btn" title="حذف" onclick="deleteLeave('${l.id}')">🗑</button>`;
    return `<tr>
      <td>${e? escapeHtml(e.name):'—'}</td>
      <td>${e? (escapeHtml(e.code)||'—'):'—'}</td>
      <td>${e? `<span class="pill factory-pill" style="background:${factoryColor(e.factory)};">${e.factory||'—'}</span>` : '—'}</td>
      <td>${e? (currentShiftOf(e.id)||'—') : '—'}</td>
      <td><span class="type-dot type-${slug(l.type)}"></span> ${l.type===TRANSFER_TYPE?'🔁 ':l.type===STATUS_CHANGE_TYPE?'🔄 ':''}${l.type}</td>
      <td>${l.date}</td>
      <td class="${isTransfer?'log-transfer-note':''}">${escapeHtml(l.note)||'—'}</td>
      <td class="no-print" style="white-space:nowrap;">${actions}</td>
    </tr>`;
  }).join('');
}

function applyLogFilters(){
  const type = document.getElementById('filterType').value;
  const month = document.getElementById('filterMonth').value;
  const factory = document.getElementById('filterFactory').value;
  const shift = document.getElementById('filterShift').value;
  logTypeFilter = type;
  logMonthFilter = month;
  logFactoryFilter = factory;
  logShiftFilter = shift;
  let list = [...leaves, ...transfers];
  if(type) list = list.filter(l=>l.type===type);
  if(month) list = list.filter(l=>l.date.slice(0,7)===month);
  if(factory) list = list.filter(l=>{ const e=employees.find(x=>x.id===l.employeeId); return e && e.factory===factory; });
  if(shift) list = list.filter(l=>{ const e=employees.find(x=>x.id===l.employeeId); return e && currentShiftOf(e.id)===shift; });
  if(logSearch){
    const q = logSearch.trim().toLowerCase();
    list = list.filter(l=>{
      const e = employees.find(x=>x.id===l.employeeId);
      return (e && e.name.toLowerCase().includes(q)) || (e && (e.code||'').toLowerCase().includes(q)) || (l.note||'').toLowerCase().includes(q);
    });
  }
  fillLogTable(list);
}
function resetLogFilters(){
  logTypeFilter='';
  logMonthFilter='';
  logFactoryFilter='';
  logShiftFilter='';
  logSearch='';
  render();
}

function setCitationSort(col){ toggleSort(citationSortState, col); render(); }
function editCitation(id){
  if(!requirePermission('edit_data')) return;
  const c = citations.find(x=>x.id===id);
  if(!c) return;
  editingCitationId = id;
  selectedCitationKind = c.kind;
  currentTab = 'rewards';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='rewards'));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function cancelCitationEdit(){ editingCitationId = null; render(); }
async function deleteCitation(id){
  if(!requirePermission('edit_data')) return;
  if(!confirm('تأكيد حذف السجل ده؟')) return;
  const c = citations.find(x=>x.id===id);
  citations = citations.filter(c=>c.id!==id);
  try{ localStorage.setItem(STORAGE_KEY_CITATIONS, JSON.stringify(citations)); }catch(err){}
  try{
    const { error } = await sb.from('citations').delete().eq('id', id);
    if(error) throw error;
    showToast('تم الحذف');
    if(c) logActivity(`حذف ${c.kind} لـ${empName(c.employeeId)}`);
  }catch(err){
    showToast('❌ الحذف اتعمل عندك بس مش على السيرفر — تأكد من النت وحاول تاني');
  }
  render();
}

function attachHandlers(){
  if(currentTab==='settings'){
    if(!requirePermission('manage_users')){
      switchTab('dash');
      return;
    }
    loadAndRenderUsersList();
    loadAndRenderActivityLog();
    const nuForm = document.getElementById('newUserForm');
